name: CI/CD DevSecOps Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-and-test:
    needs: secret-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
      - name: Build with Maven
        run: mvn clean install -DskipTests
      - name: Run tests
        run: mvn test

  release:
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
      - name: Package application
        run: mvn clean package -DskipTests
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: wrongsecrets-jar
          path: target/*.jar

  vault-demo:
    needs: secret-scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    services:
      vault:
        image: hashicorp/vault:latest
        ports:
          - 8200:8200
        env:
          VAULT_DEV_ROOT_TOKEN_ID: myroot
          VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
      - name: Install Vault CLI
        run: |
          curl -fsSL https://releases.hashicorp.com/vault/1.17.2/vault_1.17.2_linux_amd64.zip -o vault.zip
          unzip vault.zip
          sudo mv vault /usr/local/bin/
      - name: Wait for Vault to be ready
        run: |
          export VAULT_ADDR=http://127.0.0.1:8200
          export VAULT_TOKEN=myroot
          for i in $(seq 1 15); do
            if vault status; then
              echo "Vault est pret."
              break
            fi
            echo "Vault pas encore pret, tentative $i..."
            sleep 2
          done
      - name: Create secrets in Vault
        run: |
          export VAULT_ADDR=http://127.0.0.1:8200
          export VAULT_TOKEN=myroot
          vault kv put secret/wrongsecrets DB_PASSWORD="CIDemoPassword123!" API_KEY="sk-ci-demo-456"
      - name: Read secrets and build
        run: |
          export VAULT_ADDR=http://127.0.0.1:8200
          export VAULT_TOKEN=myroot
          export DB_PASSWORD=$(vault kv get -field=DB_PASSWORD secret/wrongsecrets)
          export API_KEY=$(vault kv get -field=API_KEY secret/wrongsecrets)
          echo "Secrets recuperes avec succes depuis Vault (valeurs masquees par GitHub)"
          mvn clean install -DskipTests
