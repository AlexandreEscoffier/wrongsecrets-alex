name: DevSecOps Pipeline

on:
  push:
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Build project
        run: mvn clean compile

      - name: Run tests
        run: mvn test


  secret-scanning:
    runs-on: ubuntu-latest
    needs: build-test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 🔴 GITLEAKS
      - name: Run Gitleaks
        run: |
          docker run --rm -v $PWD:/repo zricethezav/gitleaks detect -s /repo -v

      # 🟠 TRUFFLEHOG
      - name: Install TruffleHog
        run: pip install trufflehog

      - name: Run TruffleHog
        run: trufflehog filesystem . --json

      # 🔵 DETECT-SECRETS
      - name: Install detect-secrets
        run: pip install detect-secrets

      - name: Run detect-secrets
        run: detect-secrets scan > secrets-report.json


  deploy-simulation:
    runs-on: ubuntu-latest
    needs: secret-scanning

    steps:
      - name: Simulate deployment
        run: echo "Deployment OK (simulation without infra)"
